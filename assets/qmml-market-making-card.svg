<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">QMML Market Making  2nd overall, 1st Sortino</title>
  <desc id="desc">Stylized bid-ask spread and equity step chart on a dark background.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#0f1629"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" rx="12"/>
  <text x="40" y="52" fill="#e0e0e0" font-family="system-ui, Segoe UI, sans-serif" font-size="22" font-weight="600">QMML Market Making</text>
  <text x="40" y="82" fill="#a0a0a0" font-family="system-ui, Segoe UI, sans-serif" font-size="14">2nd / 93 teams · 1st Sortino · 9 live rounds</text>
  <rect x="40" y="110" width="720" height="1" fill="rgba(138,99,255,0.35)"/>
  <!-- Bid/ask bars -->
  <text x="40" y="145" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Bid / Ask (conceptual)</text>
  <rect x="120" y="160" width="80" height="28" fill="#22c55e" opacity="0.85" rx="4"/>
  <text x="148" y="179" fill="#0a0e27" font-size="12" font-weight="600" font-family="system-ui, sans-serif">Bid</text>
  <rect x="400" y="160" width="80" height="28" fill="#ef4444" opacity="0.85" rx="4"/>
  <text x="425" y="179" fill="#fafafa" font-size="12" font-weight="600" font-family="system-ui, sans-serif">Ask</text>
  <line x1="200" y1="174" x2="400" y2="174" stroke="url(#accent)" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="300" cy="174" r="6" fill="#8a63ff"/>
  <!-- Step equity line -->
  <text x="40" y="240" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Equity path (schematic)</text>
  <polyline fill="none" stroke="#8a63ff" stroke-width="3" stroke-linejoin="round"
    points="60,360 140,340 220,320 300,300 380,285 460,270 540,255 620,235 700,215"/>
  <circle cx="700" cy="215" r="7" fill="#3b82f6"/>
  <text x="618" y="205" fill="#a0a0a0" font-size="12" font-family="system-ui, sans-serif">Final bankroll ‘</text>
  <rect x="40" y="378" width="200" height="28" rx="6" fill="rgba(124,58,237,0.25)" stroke="rgba(124,58,237,0.5)"/>
  <text x="52" y="397" fill="#c4b5fd" font-size="12" font-family="system-ui, sans-serif">Kelly-style sizing · Risk caps</text>
</svg>
